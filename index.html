<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Music Player</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <div class="player">

        <audio id="audioPlayer"></audio>


        <!-- Upload Section -->

        <div class="upload-section">

            <label for="audioUpload">
                🎵 Choose Audio
            </label>

            <input
                type="file"
                id="audioUpload"
                accept=".mp3,.m4a,.wav,.ogg,.aac,.webm,audio/mpeg,audio/mp4,audio/wav,audio/ogg,audio/aac,audio/webm"
            >


            <label for="coverUpload">
                🖼️ Choose Cover
            </label>

            <input
                type="file"
                id="coverUpload"
                accept="image/*"
            >


            <button id="saveMusic">
                ＋ Save Music
            </button>

        </div>


        <!-- Cover -->

        <div class="cover">

            <img
                id="coverImage"
                src=""
                alt="Cover"
            >

            <div class="music-icon">
                ♫
            </div>

        </div>


        <!-- Song Information -->

        <h1 id="songTitle">
            No Song Selected
        </h1>

        <p id="artistName">
            Your Music Library
        </p>


        <!-- Progress -->

        <div class="progress-area">

            <div class="progress-bar">

                <div class="progress"></div>

            </div>


            <div class="time">

                <span>0:00</span>

                <span>0:00</span>

            </div>

        </div>


        <!-- Controls -->

        <div class="controls">

    <button id="repeatBtn">
        ↶
    </button>

    <button id="previousBtn">
        ⏮
    </button>

    <button class="play-btn">
        ▶
    </button>

    <button id="nextBtn">
        ⏭
    </button>

    <button id="shuffleBtn">
        🔀
    </button>

        </div>


        <!-- Volume -->

        <div class="volume">

            <span>
                🔊
            </span>

            <input
                type="range"
                min="0"
                max="100"
                value="80"
            >

        </div>

    </div>

<div class="sleep-timer">

    <span>⏱️ Sleep Timer</span>

    <select id="sleepTimer">

        <option value="0">
            Off
        </option>

        <option value="15">
            15 Minutes
        </option>

        <option value="30">
            30 Minutes
        </option>

        <option value="45">
            45 Minutes
        </option>

        <option value="60">
            60 Minutes
        </option>

        <option value="90">
            90 Minutes
        </option>

    </select>

    </div>
    <!-- Music Library -->

    <div class="library">
<div class="library-tools">

    <input
        type="search"
        id="searchInput"
        placeholder="🔍 Search your music..."
    >

    <button id="favoriteFilter">
        ♡ Favorites
    </button>

</div>
        <div class="library-header">

            <h2>
                My Library
            </h2>

            <span id="songCount">
                0 Songs
            </span>

        </div>


        <div id="songList"></div>

    </div>


    <script src="app.js"></script>

</body>

</html>
