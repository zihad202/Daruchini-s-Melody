name: Build Daruchini's Melody APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android background audio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />',
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />'
          ]

          for permission in permissions:
              if permission.strip() not in text:
                  text = text.replace(
                      '<manifest ',
                      '<manifest ',
                      1
                  )
                  pos = text.find('>', text.find('<manifest'))
                  text = text[:pos + 1] + '\n' + permission + text[pos + 1:]

          service = '''        <service
              android:name="us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService"
              android:description="@string/audio_player_service_description"
              android:foregroundServiceType="mediaPlayback"
              android:exported="true">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaSessionService"/>
              </intent-filter>
          </service>
          '''

          if 'us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService' not in text:
              text = text.replace(
                  '</application>',
                  service + '    </application>'
              )

          manifest.write_text(text)
          PY

      - name: Add audio service description
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/audio_service_strings.xml <<'EOF'
          <resources>
              <string name="audio_player_service_description">
                  Allows for audio to play in the background.
              </string>
          </resources>
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daruchinis-Melody-background-audio
          path: android/app/build/outputs/apk/debug/app-debug.apk
